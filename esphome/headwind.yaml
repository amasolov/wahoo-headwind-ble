# Standalone ESP32 controller for a Wahoo KICKR Headwind (no HA integration
# needed). Use this if you prefer a dedicated ESP32 next to the fan instead of
# the custom integration + Bluetooth proxy.
#
# Replace the MAC below (find it with tools/headwind_probe.py scan or the
# ESPHome logs) and flash to any ESP32.
substitutions:
  headwind_mac: "AA:BB:CC:DD:EE:FF"
  service_uuid: "a026ee0c-0a7d-4ab3-97fa-f1500f9feb8b"
  char_uuid: "a026e038-0a7d-4ab3-97fa-f1500f9feb8b"

esphome:
  name: headwind-bridge

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:

ble_client:
  - mac_address: ${headwind_mac}
    id: headwind
    on_connect:
      then:
        - logger.log: "Headwind connected"
        # Ask for the current speed so the sensor has a value right away.
        - delay: 1s
        - ble_client.ble_write:
            id: headwind
            service_uuid: ${service_uuid}
            characteristic_uuid: ${char_uuid}
            value: [0x01]

output:
  - platform: template
    id: headwind_speed
    type: float
    write_action:
      # Manual mode, then speed 0-100 %.
      - ble_client.ble_write:
          id: headwind
          service_uuid: ${service_uuid}
          characteristic_uuid: ${char_uuid}
          value: [0x04, 0x04]
      - ble_client.ble_write:
          id: headwind
          service_uuid: ${service_uuid}
          characteristic_uuid: ${char_uuid}
          value: !lambda |-
            return {0x02, (uint8_t) roundf(state * 100.0f)};

fan:
  - platform: speed
    name: "Headwind"
    output: headwind_speed
    speed_count: 100

select:
  - platform: template
    name: "Headwind mode"
    id: headwind_mode
    optimistic: true
    options: ["Off", "Manual", "Heart rate", "Speed", "Power", "Core temp", "Running speed"]
    set_action:
      - ble_client.ble_write:
          id: headwind
          service_uuid: ${service_uuid}
          characteristic_uuid: ${char_uuid}
          value: !lambda |-
            // Mode values from the Wahoo app: 1 POWER_OFF, 2 HEARTRATE, 3 SPEED,
            // 4 DIRECT (manual), 6 CORE_TEMP, 7 RUN_SPEED, 8 POWER.
            if (x == "Off") return {0x04, 0x01};
            if (x == "Heart rate") return {0x04, 0x02};
            if (x == "Speed") return {0x04, 0x03};
            if (x == "Power") return {0x04, 0x08};
            if (x == "Core temp") return {0x04, 0x06};
            if (x == "Running speed") return {0x04, 0x07};
            return {0x04, 0x04};

sensor:
  # Fan speed from the fan's state events (FD 01 <speed %> <mode>).
  # Raw notifications are logged at DEBUG level.
  - platform: ble_client
    type: characteristic
    ble_client_id: headwind
    name: "Headwind reported speed"
    unit_of_measurement: "%"
    service_uuid: ${service_uuid}
    characteristic_uuid: ${char_uuid}
    notify: true
    lambda: |-
      std::string raw;
      char buf[4];
      for (auto b : x) { snprintf(buf, sizeof(buf), "%02x ", b); raw += buf; }
      ESP_LOGD("headwind", "notify: %s", raw.c_str());
      if (x.size() >= 4 && x[0] == 0xFD && x[1] == 0x01) return (float) x[2];
      if (x.size() >= 3 && x[0] == 0xFE && x[1] == 0x01) return (float) x[2];
      return NAN;
