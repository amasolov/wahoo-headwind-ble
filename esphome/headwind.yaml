# Standalone ESP32 controller for a Wahoo KICKR Headwind (no HA integration
# needed). Use this if you prefer a dedicated ESP32 next to the fan instead of
# the custom integration + Bluetooth proxy.
#
# Replace the MAC below (find it with tools/headwind_probe.py scan or the
# ESPHome logs) and flash to any ESP32.
substitutions:
  headwind_mac: "AA:BB:CC:DD:EE:FF"
  service_uuid: "a026ee0c-0a7d-4ab3-97fa-f1500f9feb8b"
  char_uuid: "a026e038-0a7d-4ab3-97fa-f1500f9feb8b"

esphome:
  name: headwind-bridge

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:

ble_client:
  - mac_address: ${headwind_mac}
    id: headwind
    on_connect:
      then:
        - logger.log: "Headwind connected"

output:
  - platform: template
    id: headwind_speed
    type: float
    write_action:
      # Manual mode, then speed 0-100 %.
      - ble_client.ble_write:
          id: headwind
          service_uuid: ${service_uuid}
          characteristic_uuid: ${char_uuid}
          value: [0x04, 0x04]
      - ble_client.ble_write:
          id: headwind
          service_uuid: ${service_uuid}
          characteristic_uuid: ${char_uuid}
          value: !lambda |-
            return {0x02, (uint8_t) roundf(state * 100.0f)};

fan:
  - platform: speed
    name: "Headwind"
    output: headwind_speed
    speed_count: 100

select:
  - platform: template
    name: "Headwind mode"
    optimistic: true
    options: ["Heart rate", "Speed", "Sleep", "Manual"]
    set_action:
      - ble_client.ble_write:
          id: headwind
          service_uuid: ${service_uuid}
          characteristic_uuid: ${char_uuid}
          value: !lambda |-
            static const char *opts[] = {"Heart rate", "Speed", "Sleep", "Manual"};
            for (uint8_t i = 0; i < 4; i++)
              if (x == opts[i]) return {0x04, (uint8_t)(i + 1)};
            return {0x04, 0x04};

sensor:
  # Reported fan speed; raw notifications are logged at DEBUG level.
  - platform: ble_client
    type: characteristic
    ble_client_id: headwind
    name: "Headwind reported speed"
    unit_of_measurement: "%"
    service_uuid: ${service_uuid}
    characteristic_uuid: ${char_uuid}
    notify: true
    lambda: |-
      std::string raw;
      char buf[4];
      for (auto b : x) { snprintf(buf, sizeof(buf), "%02x ", b); raw += buf; }
      ESP_LOGD("headwind", "notify: %s", raw.c_str());
      if (x.size() >= 5 && x[0] == 0xFD && x[1] == 0x01) return (float) x[4];
      return NAN;
