name: Validate

on:
  # Pushes to the default branch only: a PR branch is already covered by
  # pull_request, and running both doubled every PR's CI.
  push:
    branches: [claude/wahoo-headwind-ha-integration-cqwegr]
  pull_request:
  # Weekly, to catch upstream HA or runner changes. GitHub disables scheduled
  # workflows after 60 days without a commit; Renovate PRs keep it alive.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # Not submitted to home-assistant/brands.
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # home-assistant/actions publishes no releases, only master; Renovate
      # tracks the branch digest.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # HA 2026.3+ requires Python >= 3.14.2. On 3.13 the resolver silently
      # fell back to HA 2026.2.3, so CI tested a release months older than
      # the one the integration actually runs on.
      - run: uv venv -p 3.14 .venv
      - run: uv pip install -p .venv -r requirements_test.txt
      - run: .venv/bin/python -m pytest -q
